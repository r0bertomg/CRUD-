<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Assinantes | cinelume</title>
</head>
<body>
    <header class="topo">
        <a class="marca" href="BemVindo.html">cinelume</a>
        <nav>
            <a href="BemVindo.html">Voltar ao início</a>
        </nav>
    </header>

    <main class="conteudo">
        <h1>Assinantes</h1>

        <div class="barra">
            <input type="text" id="busca" placeholder="Buscar por CPF">
            <button onclick="buscar()">Buscar</button>
            <button class="sec" onclick="listar()">Mostrar todos</button>
        </div>

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Sobrenome</th>
                        <th>CPF</th>
                        <th>Email</th>
                        <th>Telefone</th>
                        <th>Cidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </div>
    </main>

    <aside id="edicao" style="display: none;">
        <h2>Editar assinante</h2>

        <div class="campo">
            <label>Nome</label>
            <input type="text" id="nome">
        </div>
        <div class="campo">
            <label>Sobrenome</label>
            <input type="text" id="sobrenome">
        </div>
        <div class="campo">
            <label>CPF</label>
            <input type="text" id="cpf">
        </div>
        <div class="campo">
            <label>Email</label>
            <input type="text" id="email">
        </div>
        <div class="campo">
            <label>Senha</label>
            <input type="text" id="senha">
        </div>
        <div class="campo">
            <label>Rua</label>
            <input type="text" id="rua">
        </div>
        <div class="campo">
            <label>CEP</label>
            <input type="text" id="cep">
        </div>
        <div class="campo">
            <label>Cidade</label>
            <input type="text" id="cidade">
        </div>
        <div class="campo">
            <label>Estado</label>
            <input type="text" id="estado">
        </div>
        <div class="campo">
            <label>Telefone</label>
            <input type="text" id="telefone">
        </div>

        <div class="acoes">
            <button onclick="salvar()">Salvar</button>
            <button class="sec" onclick="cancelar()">Cancelar</button>
        </div>
    </aside>

    <script src="admin.js"></script>
</body>
</html>
