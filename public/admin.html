<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Administração</title>
</head>
<body>
    <h1>Administração de Usuários</h1>

    <p><a href="BemVindo.html">Voltar</a></p>

    <input type="text" id="busca" placeholder="Buscar por CPF">
    <button onclick="buscar()">Buscar</button>
    <button onclick="listar()">Mostrar todos</button>

    <br><br>

    <table>
        <tr>
            <th>Nome</th>
            <th>Sobrenome</th>
            <th>CPF</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Cidade</th>
            <th>Ações</th>
        </tr>
        <tbody id="lista"></tbody>
    </table>

    <div id="edicao" style="display: none;">
        <h2 style="font-size: 30px;">Editar usuário</h2>

        <label>Nome:</label><br>
            <input type="text" id="nome"><br>
        <label>Sobrenome:</label><br>
            <input type="text" id="sobrenome"><br>
        <label>CPF:</label><br>
            <input type="text" id="cpf"><br>
        <label>Email:</label><br>
            <input type="text" id="email"><br>
        <label>Senha:</label><br>
            <input type="text" id="senha"><br>
        <label>Rua:</label><br>
            <input type="text" id="rua"><br>
        <label>CEP:</label><br>
            <input type="text" id="cep"><br>
        <label>Cidade:</label><br>
            <input type="text" id="cidade"><br>
        <label>Estado:</label><br>
            <input type="text" id="estado"><br>
        <label>Telefone:</label><br>
            <input type="text" id="telefone"><br><br>

        <button onclick="salvar()">Salvar</button>
        <button onclick="cancelar()">Cancelar</button>
    </div>

    <script src="admin.js"></script>
</body>
</html>
