<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro | cinelume</title>
</head>
<body>
    <main class="auth larga">
        <section class="auth-hero">
            <a class="marca" href="index.html">cinelume</a>
            <div>
                <h2>Crie sua conta.</h2>
                <p>Preencha seus dados e comece a assistir em poucos minutos.</p>
            </div>
        </section>

        <section class="auth-form">
            <div class="caixa">
                <h1>Cadastre-se</h1>

                <div class="campos">
                    <div class="campo">
                        <label>Nome</label>
                        <input type="text" id="nome">
                    </div>
                    <div class="campo">
                        <label>Sobrenome</label>
                        <input type="text" id="sobrenome">
                    </div>
                    <div class="campo">
                        <label>CPF</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00">
                    </div>
                    <div class="campo">
                        <label>Telefone</label>
                        <input type="text" id="telefone" placeholder="(11) 99999-9999">
                    </div>
                    <div class="campo largo">
                        <label>Email</label>
                        <input type="text" id="email" placeholder="voce@email.com">
                    </div>
                    <div class="campo largo">
                        <label>Senha</label>
                        <input type="password" id="senha">
                    </div>
                    <div class="campo largo">
                        <label>Rua</label>
                        <input type="text" id="rua">
                    </div>
                    <div class="campo">
                        <label>CEP</label>
                        <input type="text" id="cep" placeholder="00000-000">
                    </div>
                    <div class="campo">
                        <label>Cidade</label>
                        <input type="text" id="cidade">
                    </div>
                    <div class="campo">
                        <label>Estado</label>
                        <input type="text" id="estado" placeholder="SP">
                    </div>
                </div>

                <button class="cheio" onclick="enviarDados()">Criar conta</button>

                <p class="troca">Já tem conta? <a href="index.html">Entrar</a></p>
            </div>
        </section>
    </main>

    <script src="/public/cadastro.js"></script>
</body>
</html>
